version: '3.8'

services:
  app:
    build:
      context: ../../
      dockerfile: Dockerfile.dev
    container_name: palenque-dev
    ports:
      - "3002:3000"
    volumes:
      - ../../:/app:cached
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - WATCHPACK_POLLING=true
    env_file:
      - ../../.env.development
    networks:
      - hotel-network
    command: npm run dev

  # Base de données de développement
  postgres:
    image: postgres:15-alpine
    container_name: hotel-postgres-dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: hotel_user
      POSTGRES_PASSWORD: hotel_pass
      POSTGRES_DB: hotel_db
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ../../docker/dev/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - hotel-network

  # Redis pour cache/sessions en dev
  redis:
    image: redis:7-alpine
    container_name: hotel-redis-dev
    ports:
      - "6379:6379"
    networks:
      - hotel-network

volumes:
  postgres_dev_data:

networks:
  hotel-network:
    driver: bridge